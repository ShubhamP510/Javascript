<!DOCTYPE html>
<html>
<head>
    <title>Prompt Example</title>
</head>
<body>
    <script>
        let age = prompt("Enter your age:");
        // console.log("Your age is: ", age);
        if (age >= 18) {
            console.log("You are an adult.");
        } else {
            console.log("You are a minor.");
        }
    </script>
</body>
</html>
